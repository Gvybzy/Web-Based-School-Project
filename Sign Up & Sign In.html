<!DOCTYPE html>
<html lang="en">


<head>


        <!---------------------BASE INFO--------------------------->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-------------------- TITLE --------------->
        <title>RNHS | REGISTRATION FORM</title>
        <!-------------------- Site Icon ---------------------->
        <link rel="shortcut icon" href="IMAGES/Logo.png" type="image/x-icon"/>
        <!-------------------------- LINKS ------------------------------------>
        <link rel="stylesheet" href="Sign In & Sign Up/Sign In & Sign Up.css">
        <script src="Sign In & Sign Up/Sign In & Sign Up.js"></script>
        <link rel="stylesheet" href="Loader/loader.css">
        <script src="Loader/loader.js"></script>
    
    
</head>



<body>


<!----------------------------------------------- START-LOADER -------------------------------------------------->
    <div class="loader"></div>
<!----------------------------------------------- END-LOADER -------------------------------------------------->


<!------------------------------------------------ SIGN UP & SIGN IN SECTION ------------------------------------------->



  <div class="wrapper">
    <!---------------------------------- Sign In Form ----------------------------------------->
    <div class="form-box" id="sign-in-form">
      <h2>Sign In</h2>
      <form id="loginForm" onsubmit="return login(event)">
        <div class="input-box">
          <input type="email" id="login-email" placeholder="Email" required>
        </div>
        <div class="input-box">
          <input type="password" id="login-password" placeholder="Password" required>
        </div>
        <div class="submit-box">
          <input type="submit" class="submit-btn" value="Sign In">
        </div>
        <p class="switch-link">Don't have an account? <a href="#" id="to-sign-up" onclick="showSignUp()">Sign Up</a></p>
      </form>
      <p><a href="index.html" class="back-link">Back to RNHS</a></p>
    </div>

    <!------------------------------------- Sign Up Form ------------------------------------------>
    <div class="form-box" id="sign-up-form" style="display: none;">
      <h2>Sign Up</h2>
      <form id="registerForm" onsubmit="return register(event)">
        <div class="input-box">
          <input type="text" id="signup-name" placeholder="Full Name" required>
        </div>
        <div class="input-box">
          <input type="email" id="signup-email" placeholder="Email" required>
        </div>
        <div class="input-box">
          <input type="password" id="signup-password" placeholder="Password" required>
        </div>
        <div class="submit-box">
          <input type="submit" class="submit-btn" value="Sign Up">
        </div>
        <p class="switch-link">Already have an account? <a href="#" id="to-sign-in" onclick="showSignIn()">Sign In</a></p>
      </form>
      <p><a href="index.html" class="back-link">Back to RNHS</a></p>
    </div>
  </div>




</body>
</html>
